name: Maven verification

on:
  push:
    branches:
      - integration/pre-develop
      - develop
      - main
  pull_request:
    branches:
      - integration/pre-develop
      - develop
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify unit and container integration tests
        run: bash ./mvnw -B -Pintegration-tests verify
