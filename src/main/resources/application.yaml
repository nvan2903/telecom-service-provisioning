
spring:
  application:
    name: telecom-service-provisioning
  datasource:
    url: jdbc:postgresql://localhost:5432/telecom_db
    username: telecom_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
